[project]
name = "preempt"
version = "1.0.0"
description = "A call before the fall: bed-exit, gait and hazard watch from abstracted pose"
requires-python = ">=3.12"
dependencies = [
    # PINNED. `opencv-python` unpinned resolves to 4.14.x, which shipped after
    # 5.0.0 and would fail the competition's core requirement outright.
    "opencv-python-headless==5.0.0.93",
    "numpy==2.5.3",
    "visioncore",
    "servicekit",
]

[project.optional-dependencies]
aws = ["boto3==1.42.7"]

[project.scripts]
preempt = "preempt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/preempt"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a second",
    "models: needs the ONNX model files under models/",
    "dataset: needs the UR Fall download under eval/data",
]
